      <circle cx="-1.6" cy="-11" r=".7" fill="#f3f7fc" stroke="none"/><circle cx="1.6" cy="-11" r=".7" fill="#f3f7fc" stroke="none"/>
    </g>
    <g transform="translate(347 98) scale(1.2)" stroke-width="1.08">
      <rect x="-5" y="-6" width="3" height="6"/><rect x="-1" y="-6" width="3" height="6"/><rect x="5" y="-6" width="3" height="6"/><rect x="9" y="-6" width="3" height="6"/>
      <ellipse cx="2" cy="-8" rx="9.5" ry="6"/>
      <circle cx="-8" cy="-10" r="5"/>
