      <path d="M-5 -8 L-7.5 -3 M5 -8 L7.5 -3 M-2 0 h-3 M2 0 h3 M-1.6 -10 L0 -8.4 L1.6 -10" fill="none"/>
      <circle cx="-1.6" cy="-11" r=".7" fill="#f3f7fc" stroke="none"/><circle cx="1.6" cy="-11" r=".7" fill="#f3f7fc" stroke="none"/>
    </g>
    <g transform="translate(297 98) scale(1.65)" stroke-width="0.79">
