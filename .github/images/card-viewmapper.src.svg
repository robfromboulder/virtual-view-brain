  </g>
  <g filter="url(#wob)" fill="#245f9f" stroke="#f3f7fc" stroke-width="1.6">
    <circle cx="309" cy="66" r="6"/><circle cx="309" cy="102" r="6"/><circle cx="265" cy="140" r="6"/><circle cx="353" cy="140" r="6"/>
  </g>
